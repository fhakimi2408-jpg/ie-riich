<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background filter & shadows -->
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>

    <filter id="gold-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#b45309" flood-opacity="0.4" />
    </filter>

    <!-- Metallic Chrome Gradients for IERIICH Letters -->
    <linearGradient id="chrome-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="20%" stop-color="#cbd5e1" />
      <stop offset="42%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="58%" stop-color="#0f172a" />
      <stop offset="75%" stop-color="#334155" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <linearGradient id="chrome-highlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>

    <!-- Metallic Gold Gradients for the '13' Emblem and Accent Lines -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="75%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#854d0e" />
    </linearGradient>

    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#fef9c3" stop-opacity="0.7" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="gold-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0" />
      <stop offset="15%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="85%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </linearGradient>

    <!-- Star Lens Flare Radial Gradient -->
    <radialGradient id="flare-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="30%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sparkle Light Flares -->
  <g transform="translate(145, 75)">
    <circle cx="0" cy="0" r="28" fill="url(#flare-glow)" />
    <!-- 4-point star rays -->
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#ffffff" />
    <path d="M 0 -48 Q 0 0 48 0 Q 0 0 0 48 Q 0 0 -48 0 Q 0 0 0 -48 Z" fill="#fef08a" opacity="0.6" />
  </g>

  <!-- Lens Flare near the 13 Emblem -->
  <g transform="translate(685, 80)">
    <circle cx="0" cy="0" r="32" fill="url(#flare-glow)" />
    <path d="M 0 -40 Q 0 0 40 0 Q 0 0 0 40 Q 0 0 -40 0 Q 0 0 0 -40 Z" fill="#ffffff" />
  </g>

  <!-- MAIN METALLIC IERIICH LETTERS GROUP -->
  <g filter="url(#drop-shadow)">

    <!-- Letter 'I' -->
    <g transform="translate(145, 60)">
      <rect x="0" y="0" width="36" height="150" rx="3" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
      <rect x="2" y="2" width="10" height="146" fill="#ffffff" opacity="0.25" />
      <line x1="3" y1="3" x2="33" y2="3" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="3" y1="147" x2="33" y2="147" stroke="#0f172a" stroke-width="2" opacity="0.8" />
    </g>

    <!-- Letter 'E' -->
    <g transform="translate(195, 60)">
      <path d="M 0 0 L 88 0 L 88 32 L 36 32 L 36 58 L 78 58 L 78 90 L 36 90 L 36 118 L 88 118 L 88 150 L 0 150 Z" 
            fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Bevel highlights -->
      <path d="M 2 2 L 86 2 L 86 6 L 38 6 L 38 146 L 2 146 Z" fill="#ffffff" opacity="0.25" />
      <line x1="36" y1="58" x2="76" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    </g>

    <!-- Letter 'R' -->
    <g transform="translate(298, 60)">
      <path d="M 0 0 L 64 0 C 86 0 100 14 100 42 C 100 66 86 78 68 82 L 102 150 L 64 150 L 36 90 L 36 150 L 0 150 Z 
               M 36 30 L 60 30 C 68 30 72 34 72 42 C 72 50 68 56 60 56 L 36 56 Z" 
            fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Inner cutout highlight -->
      <line x1="2" y1="2" x2="64" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="38" y1="32" x2="58" y2="32" stroke="#0f172a" stroke-width="1.5" opacity="0.6" />
    </g>

    <!-- First 'I' of 'II' -->
    <g transform="translate(415, 60)">
      <rect x="0" y="0" width="34" height="150" rx="3" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
      <line x1="2" y1="2" x2="32" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <rect x="2" y="2" width="8" height="146" fill="#ffffff" opacity="0.2" />
    </g>

    <!-- Second 'I' of 'II' -->
    <g transform="translate(460, 60)">
      <rect x="0" y="0" width="34" height="150" rx="3" fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" />
      <line x1="2" y1="2" x2="32" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <rect x="2" y="2" width="8" height="146" fill="#ffffff" opacity="0.2" />
    </g>

    <!-- Letter 'C' / The Emblem Enclosure with stylized Golden '13' inside -->
    <g transform="translate(512, 52)">
      <!-- Outer metallic rounded letter C ring -->
      <path d="M 125 15 C 100 2 30 2 12 36 C -8 72 -6 112 14 142 C 34 172 104 170 128 155 L 128 122 C 106 136 50 138 38 116 C 26 94 28 66 40 48 C 54 28 106 28 125 44 Z" 
            fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />

      <!-- Inner Glowing Core Background for '13' -->
      <circle cx="82" cy="85" r="54" fill="#ffffff" opacity="0.95" />
      <circle cx="82" cy="85" r="54" fill="url(#flare-glow)" opacity="0.4" />
      <circle cx="82" cy="85" r="52" fill="none" stroke="url(#gold-grad)" stroke-width="2.5" opacity="0.85" />

      <!-- STYLIZED GOLD METALLIC '13' EMBLEM -->
      <g transform="translate(52, 44)" filter="url(#gold-shadow)">
        <!-- Number '1' in isometric/stencil gold -->
        <path d="M 4 20 L 16 8 L 26 8 L 26 68 L 14 68 L 14 24 L 6 30 Z" 
              fill="url(#gold-grad)" stroke="#78350f" stroke-width="1.2" />
        <!-- Number '1' top highlight -->
        <path d="M 16 8 L 26 8 L 26 12 L 18 12 Z" fill="#ffffff" opacity="0.8" />

        <!-- Number '3' in isometric/stencil gold -->
        <path d="M 32 8 L 58 8 L 58 24 L 46 34 L 58 44 L 58 68 L 32 68 L 32 54 L 46 54 L 46 42 L 36 36 L 46 30 L 46 20 L 32 20 Z" 
              fill="url(#gold-grad)" stroke="#78350f" stroke-width="1.2" />
        <!-- Number '3' top highlight -->
        <line x1="32" y1="8" x2="58" y2="8" stroke="#ffffff" stroke-width="1.8" opacity="0.9" />
        <line x1="34" y1="66" x2="56" y2="66" stroke="#451a03" stroke-width="1.8" opacity="0.7" />
      </g>
    </g>

    <!-- Letter 'H' -->
    <g transform="translate(680, 60)">
      <path d="M 0 0 L 36 0 L 36 58 L 84 58 L 84 0 L 120 0 L 120 150 L 84 150 L 84 92 L 36 92 L 36 150 L 0 150 Z" 
            fill="url(#chrome-grad)" stroke="#1e293b" stroke-width="1.5" stroke-linejoin="round" />
      <!-- Bevel Highlights -->
      <line x1="2" y1="2" x2="34" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="86" y1="2" x2="118" y2="2" stroke="#ffffff" stroke-width="2" opacity="0.8" />
      <line x1="36" y1="58" x2="84" y2="58" stroke="#ffffff" stroke-width="1.5" opacity="0.7" />
    </g>

  </g>

  <!-- METALLIC GOLD ACCENT SEPARATOR LINE (EXACT POSTER DETAIL) -->
  <g transform="translate(120, 230)">
    <rect x="0" y="0" width="760" height="3" fill="url(#gold-line)" />
    <!-- Center light spark on gold bar -->
    <circle cx="380" cy="1.5" r="4" fill="#ffffff" />
    <circle cx="380" cy="1.5" r="8" fill="#fef08a" opacity="0.5" />
  </g>

  <!-- SUBTITLE BLOCK (TYPOGRAPHY MATCHING POSTER) -->
  <g text-anchor="middle" font-family="'Space Grotesk', 'Plus Jakarta Sans', 'Arial', sans-serif">
    
    <!-- "INTERNATIONAL EXHIBITION OF" -->
    <text x="500" y="265" 
          font-size="19" 
          font-weight="700" 
          letter-spacing="9" 
          fill="#475569">
      INTERNATIONAL EXHIBITION OF
    </text>

    <!-- "RESEARCH" -->
    <text x="500" y="340" 
          font-size="78" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#1e293b"
          filter="url(#drop-shadow)">
      RESEARCH
    </text>

    <!-- "INVENTION • INNOVATION" -->
    <text x="500" y="400" 
          font-size="44" 
          font-weight="900" 
          letter-spacing="3.5" 
          fill="url(#gold-grad)"
          filter="url(#gold-shadow)">
      INVENTION • INNOVATION
    </text>

    <!-- "CREATIVITY & HUMANITIES" -->
    <text x="500" y="445" 
          font-size="22" 
          font-weight="800" 
          letter-spacing="7" 
          fill="#334155">
      CREATIVITY &amp; HUMANITIES
    </text>

  </g>
</svg>
