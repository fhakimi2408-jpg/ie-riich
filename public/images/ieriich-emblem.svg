<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Metallic Chrome Gradients -->
    <linearGradient id="emblem-chrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="emblem-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="70%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <radialGradient id="emblem-flare" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="40%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ca8a04" stop-opacity="0" />
    </radialGradient>

    <filter id="emblem-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield/Pill -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="#0f172a" stroke="url(#emblem-gold)" stroke-width="2.5" filter="url(#emblem-shadow)" />

  <!-- Inner ambient glow -->
  <circle cx="60" cy="60" r="42" fill="url(#emblem-flare)" opacity="0.15" />

  <!-- Outer Chrome Ring -->
  <circle cx="60" cy="60" r="40" fill="none" stroke="url(#emblem-chrome)" stroke-width="5" />
  <circle cx="60" cy="60" r="34" fill="#1e293b" stroke="url(#emblem-gold)" stroke-width="1.5" />

  <!-- Gold '13' Emblem -->
  <g transform="translate(37, 34)">
    <!-- Number 1 -->
    <path d="M 4 14 L 14 4 L 21 4 L 21 52 L 11 52 L 11 18 L 4 22 Z" fill="url(#emblem-gold)" stroke="#451a03" stroke-width="1" />
    <path d="M 14 4 L 21 4 L 21 8 L 16 8 Z" fill="#ffffff" opacity="0.8" />

    <!-- Number 3 -->
    <path d="M 27 4 L 46 4 L 46 16 L 37 25 L 46 34 L 46 52 L 27 52 L 27 42 L 36 42 L 36 32 L 29 28 L 36 24 L 36 14 L 27 14 Z" fill="url(#emblem-gold)" stroke="#451a03" stroke-width="1" />
    <line x1="27" y1="4" x2="46" y2="4" stroke="#ffffff" stroke-width="1.5" opacity="0.9" />
  </g>

  <!-- Sparkle Flare on Top Left -->
  <g transform="translate(24, 24)">
    <circle cx="0" cy="0" r="8" fill="url(#emblem-flare)" />
    <path d="M 0 -12 Q 0 0 12 0 Q 0 0 0 12 Q 0 0 -12 0 Q 0 0 0 -12 Z" fill="#ffffff" />
  </g>

  <!-- Bottom Accent Arc -->
  <path d="M 40 102 Q 60 106 80 102" stroke="url(#emblem-gold)" stroke-width="2" stroke-linecap="round" fill="none" />
</svg>
